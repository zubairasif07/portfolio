<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Registration form illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#072032" />
      <stop offset="100%" stop-color="#0e3d5b" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#114a7d" />
      <stop offset="100%" stop-color="#17639f" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <g filter="url(#glow)">
    <circle cx="300" cy="200" r="140" fill="#08f0fe" opacity="0.12" />
    <circle cx="920" cy="220" r="110" fill="#00a8ff" opacity="0.14" />
    <circle cx="640" cy="620" r="130" fill="#0ed2ff" opacity="0.09" />
  </g>
  <rect x="180" y="180" width="840" height="440" rx="42" fill="url(#card)" stroke="#0bd1ff" stroke-width="4" />
  <text x="600" y="260" text-anchor="middle" font-family="Inter, sans-serif" font-size="64" font-weight="800" fill="#ffffff">USER LOGIN</text>
  <g transform="translate(260 320)">
    <rect x="0" y="0" width="680" height="110" rx="55" fill="#1f5d8d" opacity="0.95" />
    <circle cx="70" cy="55" r="48" fill="#ffffff" />
    <path d="M50 56a20 20 0 1 1 40 0 20 20 0 1 1 -40 0" fill="#0f3c59" />
    <rect x="140" y="36" width="420" height="38" rx="19" fill="#193f5d" />
    <text x="160" y="62" font-family="Inter, sans-serif" font-size="20" fill="#8ec6ff" opacity="0.9">Username</text>
  </g>
  <g transform="translate(260 460)">
    <rect x="0" y="0" width="680" height="110" rx="55" fill="#1f5d8d" opacity="0.95" />
    <circle cx="620" cy="55" r="48" fill="#ffffff" />
    <path d="M608 45 L632 45 L620 65 Z" fill="#0f3c59" />
    <rect x="120" y="36" width="420" height="38" rx="19" fill="#193f5d" />
    <text x="140" y="62" font-family="Inter, sans-serif" font-size="20" fill="#8ec6ff" opacity="0.9">Password</text>
  </g>
  <rect x="340" y="610" width="520" height="100" rx="50" fill="#ffffff" />
  <text x="600" y="675" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="#0f3c59">LOGIN</text>
</svg>
