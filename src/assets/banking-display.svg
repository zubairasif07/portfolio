<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Banking system illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081518" />
      <stop offset="100%" stop-color="#163744" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d4e72" />
      <stop offset="100%" stop-color="#0a7ca6" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <g filter="url(#glow)">
    <circle cx="260" cy="180" r="120" fill="#2fe0ff" opacity="0.12" />
    <circle cx="920" cy="220" r="100" fill="#14d1ff" opacity="0.14" />
    <circle cx="720" cy="620" r="140" fill="#0be2ff" opacity="0.1" />
  </g>
  <rect x="200" y="150" width="800" height="500" rx="70" fill="url(#panel)" stroke="#0cf0ff" stroke-width="4" />
  <rect x="260" y="210" width="680" height="120" rx="30" fill="#0c3451" opacity="0.95" />
  <text x="600" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="52" font-weight="800" fill="#ffffff">BANKING</text>
  <rect x="280" y="320" width="620" height="260" rx="40" fill="#0f4c6f" />
  <rect x="320" y="360" width="260" height="52" rx="26" fill="#08f0fe" opacity="0.9" />
  <rect x="320" y="430" width="420" height="42" rx="21" fill="#ffffff" opacity="0.2" />
  <rect x="320" y="490" width="420" height="42" rx="21" fill="#ffffff" opacity="0.2" />
  <rect x="320" y="550" width="320" height="42" rx="21" fill="#ffffff" opacity="0.2" />
  <rect x="780" y="360" width="180" height="160" rx="36" fill="#08f0fe" opacity="0.95" />
  <text x="870" y="440" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#050c14">DATA</text>
  <circle cx="870" cy="510" r="28" fill="#050c14" />
  <path d="M858 506 L882 506 M870 494 L870 526" stroke="#08f0fe" stroke-width="6" stroke-linecap="round" />
  <text x="600" y="720" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" fill="#b0e5ff" opacity="0.9">Secure financial dashboard with analytics</text>
</svg>
