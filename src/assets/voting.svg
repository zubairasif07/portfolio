<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Online voting illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2236" />
      <stop offset="100%" stop-color="#112f4d" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3a5a" />
      <stop offset="100%" stop-color="#11567b" />
    </linearGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <g filter="url(#softglow)">
    <circle cx="300" cy="220" r="140" fill="#0cd0ff" opacity="0.12" />
    <circle cx="900" cy="260" r="110" fill="#00a8ff" opacity="0.14" />
    <circle cx="760" cy="600" r="120" fill="#0bd4ff" opacity="0.08" />
  </g>
  <rect x="180" y="180" width="840" height="440" rx="42" fill="url(#card)" stroke="#0ac6ff" stroke-width="4" />
  <rect x="260" y="250" width="620" height="300" rx="36" fill="#0b2b45" />
  <rect x="340" y="310" width="420" height="28" rx="14" fill="#08f0fe" opacity="0.9" />
  <rect x="340" y="360" width="380" height="28" rx="14" fill="#ffffff" opacity="0.16" />
  <rect x="340" y="410" width="300" height="28" rx="14" fill="#ffffff" opacity="0.16" />
  <rect x="340" y="460" width="240" height="28" rx="14" fill="#ffffff" opacity="0.16" />
  <rect x="760" y="520" width="180" height="70" rx="28" fill="#ff5d2c" />
  <text x="850" y="565" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#ffffff">VOTE</text>
  <circle cx="510" cy="570" r="46" fill="#08f0fe" />
  <circle cx="510" cy="570" r="28" fill="#0b1928" />
  <path d="M490 560 L520 560" stroke="#08f0fe" stroke-width="6" stroke-linecap="round" />
  <path d="M500 550 L500 590" stroke="#08f0fe" stroke-width="6" stroke-linecap="round" />
  <text x="620" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="2">ONLINE</text>
  <text x="620" y="260" text-anchor="middle" font-family="Inter, sans-serif" font-size="52" font-weight="700" fill="#09f3ff" letter-spacing="2">VOTING</text>
</svg>
